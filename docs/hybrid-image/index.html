<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hybrid Image Generation | Soroush Haghi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#171717;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1050px;margin:auto;padding:36px 18px 52px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}h1{font-size:36px;margin:0 0 7px}.meta{color:#666}.source{color:#171717;text-decoration:none;border:1px solid #ccc;background:#fff;padding:9px 12px;border-radius:8px;font-size:13px}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.ctl{padding:12px;border:1px solid #e5e5e5;border-radius:10px}.ct{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:8px}input[type=range]{width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}button,.file{font:inherit;font-size:13px;padding:9px 12px;border:1px solid #ccc;border-radius:9px;background:#fff;cursor:pointer}button.primary{background:#111;color:#fff;border-color:#111}input[type=file]{display:none}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.card{border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff}.head{padding:10px 12px;border-bottom:1px solid #eee;font-size:13px;font-weight:700}.cw{aspect-ratio:410/361;background:#eef0f3}canvas{width:100%;height:100%;display:block}.hint{margin-top:14px;color:#666;font-size:13px}@media(max-width:800px){.controls,.grid{grid-template-columns:1fr}.top{flex-direction:column}h1{font-size:29px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>Hybrid Image Generation</h1><div class="meta">MATLAB · Computer Vision · Image Processing</div></div>
<a class="source" href="https://github.com/SoroushHaghi/bachelor-engineering-projects/tree/main/computer-vision/hybrid-image">View source code</a></div>
<section class="panel">
<div class="controls">
<div class="ctl"><div class="ct"><span>Low-frequency blur</span><b id="v1">8 px</b></div><input id="r1" type="range" min="1" max="24" value="8"></div>
<div class="ctl"><div class="ct"><span>High-frequency blur</span><b id="v2">10 px</b></div><input id="r2" type="range" min="1" max="24" value="10"></div>
<div class="ctl"><div class="ct"><span>Detail strength</span><b id="v3">1.30×</b></div><input id="r3" type="range" min="20" max="260" value="130"></div>
</div>
<div class="toolbar"><label class="file">Upload image A<input id="fa" type="file" accept="image/*"></label><label class="file">Upload image B<input id="fb" type="file" accept="image/*"></label><button id="swap">Swap images</button><button id="reset">Reset</button><button id="download" class="primary">Download result</button></div>
<div class="grid">
<div class="card"><div class="head">Image A</div><div class="cw"><canvas id="a"></canvas></div></div>
<div class="card"><div class="head">Image B</div><div class="cw"><canvas id="b"></canvas></div></div>
<div class="card"><div class="head">Hybrid result</div><div class="cw"><canvas id="hy"></canvas></div></div>
</div>
<div class="hint">Try viewing the hybrid result from different distances or upload your own pair of images.</div>
</section></main>
<script>
const DOG="./assets/dog.jpg?v=3";
const CAT="./assets/cat.jpg?v=3";
const A=new Image(),B=new Image(),$=id=>document.getElementById(id);let ra=false,rb=false;const ca=$("a"),cb=$("b"),ch=$("hy");
function draw(ctx,img,w,h){ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h)}
function pixels(img,w,h){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});draw(x,img,w,h);return x.getImageData(0,0,w,h).data}
function boxBlur(src,w,h,r){r=Math.max(0,Math.round(r));if(r===0)return new Uint8ClampedArray(src);const out=new Uint8ClampedArray(src.length),W=w+1,H=h+1;for(let k=0;k<3;k++){const I=new Float64Array(W*H);for(let y=1;y<=h;y++){let row=0;for(let x=1;x<=w;x++){row+=src[((y-1)*w+(x-1))*4+k];I[y*W+x]=I[(y-1)*W+x]+row}}for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h-1,y+r);for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w-1,x+r),A0=y0*W+x0,B0=y0*W+(x1+1),C0=(y1+1)*W+x0,D0=(y1+1)*W+(x1+1),area=(x1-x0+1)*(y1-y0+1);out[(y*w+x)*4+k]=(I[D0]-I[B0]-I[C0]+I[A0])/area}}}for(let i=3;i<out.length;i+=4)out[i]=255;return out}
function render(){if(!ra||!rb)return;const w=410,h=361;[ca,cb,ch].forEach(c=>{c.width=w;c.height=h});draw(ca.getContext("2d"),A,w,h);draw(cb.getContext("2d"),B,w,h);const l=+$("r1").value,hb=+$("r2").value,s=+$( "r3").value/100;$("v1").textContent=l+" px";$("v2").textContent=hb+" px";$("v3").textContent=s.toFixed(2)+"×";const rawA=pixels(A,w,h),rawB=pixels(B,w,h),low=boxBlur(rawA,w,h,l),bl=boxBlur(rawB,w,h,hb),ctx=ch.getContext("2d"),out=ctx.createImageData(w,h);for(let i=0;i<rawB.length;i+=4){for(let k=0;k<3;k++){const detail=(rawB[i+k]-bl[i+k])*s;out.data[i+k]=Math.max(0,Math.min(255,low[i+k]+detail))}out.data[i+3]=255}ctx.putImageData(out,0,0)}
A.onload=()=>{ra=true;render()};B.onload=()=>{rb=true;render()};function reset(){ra=rb=false;document.getElementById("r1").value=8;document.getElementById("r2").value=10;document.getElementById("r3").value=130;A.src=DOG;B.src=CAT}reset();["r1","r2","r3"].forEach(id=>$(id).addEventListener("input",()=>requestAnimationFrame(render)));$("reset").onclick=reset;$("swap").onclick=()=>{const s=A.src;ra=rb=false;A.src=B.src;B.src=s};
function load(file,img,which){if(!file)return;const u=URL.createObjectURL(file);img.crossOrigin=null;if(which==="a")ra=false;else rb=false;img.onload=()=>{URL.revokeObjectURL(u);if(which==="a")ra=true;else rb=true;render()};img.src=u}
$("fa").onchange=e=>load(e.target.files[0],A,"a");$("fb").onchange=e=>load(e.target.files[0],B,"b");$("download").onclick=()=>{const x=document.createElement("a");x.download="hybrid-image.png";x.href=ch.toDataURL("image/png");x.click()};
</script></body></html>
